      <section>
        <h2> Inside the Shop</h2>
        <p>
          A look at the crates, the wall, and records we cant stop playing.
          Everything here is sorted by feel, not alphabet &mdash; dig around.
        </p>
      </section>

      <section class="gallery">

        <figure class="gallery-item">
          <img src="images/record1.jpg" alt="Stack of rock and indie records leaning againts a wall">
          <figcaption>
            <strong>Rock &amp; Indie</strong>
            Garage, shoegaze, and loud stuff. The front crate, always picked over first.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/record2.jpg" alt="Close-up of a worn rock record sleeve">
          <figcaption>
            <strong>Rock &amp; Indie</strong>
            Original pressings with the ring wear to prove it.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/record3.jpg" alt="Jazz and soul records lined up on a shelf">
          <figcaption>
            <strong>Jazz &amp; Soul</strong>
            Blue Note reissues, dusty soul 45s, and a whole shelf of Sunday-morning records.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/record4.jpg" alt="Turntable spinning a soul record">
          <figcaption>
            <strong>Jazz &amp; Soul</strong>
            The Listening station. Bring a record up, we'll drop the needle for you.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/record5.jpg" alt="Electronic and ambient records with colorful sleeves">
          <figcaption>
            <strong>Electronic &amp; Ambient</strong>
            Synth, house, and long-form ambient for when the shop gets quiet.
          </figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/record6.jpg" alt="Rows of electronic records in a crate">
          <figcaption>
            <strong>Electronic &amp; Ambient</strong>
            Twelve-inches, white labels, and a few things we honestly cant identify.
          </figcaption>
        </figure>

           <img src="images/record7.jpg" alt="Hip-Hop and R&amp;B records displayed on a wall">
